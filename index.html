<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Plantalog</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plantalog" />
    <meta name="theme-color" content="#0f4438" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#000; }</style>
    <script>
      // Phones: the design is drawn at 390pt wide, so a wider phone (e.g. a
      // 430 or 440pt Pro Max) scales the app up by width/390 instead of
      // stretching it. Set before first paint; plantalog.jsx reads --zoom.
      (function () {
        function fit() {
          var w = window.innerWidth;
          var touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
          var root = document.documentElement.style;
          if (touch && w > 390 && w < 600) root.setProperty("--zoom", (w / 390).toFixed(4));
          else root.removeProperty("--zoom");
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      // Init Supabase as global before app loads
      const SUPA_URL = "https://rpplsisxmjyhwwfwmcnl.supabase.co";
      const SUPA_KEY = "sb_publishable_BmUMDvDgTi1B3E-HC0KZrA_tmw9dsoY";
      window.__supabase_client = supabase.createClient(SUPA_URL, SUPA_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="plantalog.jsx?v=82"></script>
    <script>
      // The page itself is cacheable for 10 minutes (GitHub Pages sets
      // max-age=600), and a Home Screen web app often resumes from that copy,
      // so a fresh deploy could take ten minutes to appear. Ask the server for
      // the current version (never from cache) on launch and whenever the app
      // comes back to the foreground; if it differs, reload through a URL the
      // cache has no entry for. The ?v= guard stops that repeating.
      (function () {
        var HERE = "82";
        var pending = null;
        // Never reload out from under someone mid-edit: a sheet, dialog, photo
        // viewer or a focused field means unsaved typing could be on screen.
        // The update waits and lands the next time they are idle.
        function busy() {
          var el = document.activeElement;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" ||
                     el.tagName === "SELECT" || el.isContentEditable)) return true;
          return !!document.querySelector(".modal-overlay, .viewer, .cfm-overlay, .cal-popup-overlay, .dp-overlay, .primer-card");
        }
        function apply(v) {
          if (location.search.indexOf("v=" + v) !== -1) return;
          if (busy()) { pending = v; return; }
          pending = null;
          location.replace(location.pathname + "?v=" + v);
        }
        function check() {
          fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (v) { v = v && v.trim(); if (v && v !== HERE) apply(v); })
            .catch(function () {});
        }
        check();
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
        setInterval(function () { if (pending) apply(pending); }, 3000);
      })();
    </script>
  </body>
</html>
