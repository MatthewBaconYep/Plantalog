    <!-- First thing parsed, before any script or other stylesheet: the page is
         splash green until the app marks itself booted. iOS swaps its launch
         image for the live page as soon as it can, and a page still on its
         default white showed through as a two-frame flash (from a screen
         recording on an iPhone 15 Pro). -->
    <style>html:not(.booted), html:not(.booted) body { background:#0f4438; }
      /* The app builds (and loads its photos and fonts) under the splash but
         draws nothing until the splash starts to fade: a recording caught the
         app's nav bar composited above the splash for a frame. */
      html:not(.app-shown) #root { visibility:hidden; }
      /* The splash and the app are never on screen together: any cross-fade
         let iOS draw the app's fixed layers (nav bar, header) out of order
         against the splash for a few frames. The logo fades out over the
         green, then the app replaces the splash in a single frame. */</style>

    <style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#000; }</style>
    <style>
      /* Boot splash: drawn before React, Babel and the app code download and
         compile (seconds after the app has been idle), which used to show the
         page's black background. It sits outside #root, untouched by React,
         until the app has something to show, then fades (hideBootSplash).
         iOS launch images (apple-touch-startup-image, splash/) are rendered
         from this same layout, so launch image, splash and app line up. */
      #boot-splash{position:fixed;inset:0;z-index:2000;background:#0f4438;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:20px;color:#f2f0d8;
        font:600 17px/20px -apple-system, system-ui, "Segoe UI", sans-serif;
        transition:opacity .18s ease-out;
        /* Its own compositing layer, so the app rendering and restyling
           underneath never repaints it. */
        transform:translateZ(0);}
      /* The app's page zoom and the splash's counter to it, both from first
         paint. The app stylesheet sets the same rules; when it mounted mid-
         splash the zoom used to change then, re-laying out and repainting
         the whole screen, which iOS showed as a two-frame brightening. */
      html{zoom:var(--zoom, 1);}
      #boot-splash{zoom:calc(1 / var(--zoom, 1));}
      /* Desktop: the splash covers only the app column and the margins are
         black from the first frame. They used to be splash green across the
         whole window, then snapped to black as the app appeared. The column
         size repeats the app stylesheet's laptop rule, so it is right before
         that stylesheet loads. Centred with auto margins (a left:50% calc
         gets the zoom applied twice in WebKit). */
      @media (min-width:700px) and (min-height:600px) and (hover:hover) and (pointer:fine) {
        :root{--col:390px; --zoom:1.2;}
      }
      @media (hover:hover) and (pointer:fine) {
        html:not(.booted), html:not(.booted) body { background:#000; }
        #boot-splash{left:0; right:0; margin:0 auto; width:calc(var(--col, 480px) * var(--zoom, 1)); max-width:100%;}
      }
      /* The page stays splash green until booted (first style in <head>). At
         launch an iOS Home Screen app lays the page out shorter than the
         screen for a moment, and the black background showed below the
         fixed splash. */
      /* Phones: pin to the physical screen centre. At launch an iOS Home Screen
         app reports a page ~60pt shorter than the screen, which centred the
         logo that much higher than the launch image. */
      html.splash-pin #boot-splash{justify-content:flex-start;padding-top:var(--splash-top);}
      /* The logo mark alone (logo-mark.png, cream on transparent) at 132pt tall,
         as a 7KB one-colour palette PNG. The 53KB app-icon image before it
         slowed the page's first paint enough that iOS faded its launch image
         toward white while waiting, then painted the page before the image
         had decoded (a screen recording showed ~0.8s with no logo). */
      #boot-splash img{display:block;width:86px;height:132px;}
      /* The message appears after a beat, so a fast load shows just the logo. */
      /* Shown after a beat by colour, so opacity stays free for the exit fade. */
      .boot-msg{color:transparent;animation:bootMsg 0s linear .6s forwards;}
      @keyframes bootMsg{to{color:rgba(242,240,216,.7);}}
      #boot-splash img, #boot-splash .boot-msg{transition:opacity .15s ease-out;}
      #boot-splash.done img, #boot-splash.done .boot-msg{opacity:0;}
      #boot-splash.done{pointer-events:none;}
    </style>
    <script>
      if (window.matchMedia && matchMedia("(pointer: coarse)").matches) {
        var sh = Math.max(screen.width, screen.height);        // portrait height, in points
        document.documentElement.classList.add("splash-pin");
        document.documentElement.style.setProperty("--splash-top", (sh / 2 - 86) + "px");  // 86 = (132 + 20 + 20) / 2
      }
    </script>
    <script>
      // Phones: the design is drawn at 390pt wide, so a wider phone (e.g. a
      // 430 or 440pt Pro Max) scales the app up by width/390 instead of
      // stretching it. Set before first paint; plantalog.jsx reads --zoom.
      (function () {
        function fit() {
          var w = window.innerWidth;
          var touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
          var root = document.documentElement.style;
          if (touch && w > 390 && w < 600) root.setProperty("--zoom", (w / 390).toFixed(4));
          else root.removeProperty("--zoom");
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>

    <script>
      // The page itself is cacheable for 10 minutes (GitHub Pages sets
      // max-age=600), and a Home Screen web app often resumes from that copy,
      // so a fresh deploy could take ten minutes to appear. Ask the server for
      // the current version (never from cache) on launch and whenever the app
      // comes back to the foreground; if it differs, reload through a URL the
      // cache has no entry for. The ?v= guard stops that repeating.
      (function () {
        var HERE = "101";
        var pending = null;
        // Never reload out from under someone mid-edit: a sheet, dialog, photo
        // viewer or a focused field means unsaved typing could be on screen.
        // The update waits and lands the next time they are idle.
        function busy() {
          var el = document.activeElement;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" ||
                     el.tagName === "SELECT" || el.isContentEditable)) return true;
          return !!document.querySelector(".modal-overlay, .viewer, .cfm-overlay, .cal-popup-overlay, .dp-overlay, .primer-card");
        }
        function apply(v) {
          if (location.search.indexOf("v=" + v) !== -1) return;
          if (busy()) { pending = v; return; }
          pending = null;
          location.replace(location.pathname + "?v=" + v);
        }
        function check() {
          fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (v) { v = v && v.trim(); if (v && v !== HERE) apply(v); })
            .catch(function () {});
        }
        check();
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
        // Page served from a local copy at launch (see sw.js), so the first
        // paint does not wait on the network.
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
        setInterval(function () { if (pending) apply(pending); }, 3000);
      })();
